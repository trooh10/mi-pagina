<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Horario</title>

<style>

    font-family: Arial;
    margin: 0;
    background: #111;
    color: white;
}

h1 {
    text-align: center;
}

table {
    border-collapse: collapse;
    margin: auto;
    width: 95%;
    max-width: 900px;
}

td, th {
    border: 1px solid #333;
    padding: 10px;

}

}

</head>
